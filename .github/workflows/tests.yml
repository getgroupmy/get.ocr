name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      # uv brings its own build of each Python: the runner image no longer ships 3.9,
      # which is the version on the Mac mini and so the one that has to keep working
      - run: pipx install uv
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
